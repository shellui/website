name: Verify security headers

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to check (default shellui.com)
        required: false
        default: https://shellui.com/
  # Weekly schedule paused: shellui.com is served directly by GitHub Pages,
  # which cannot send these headers. Run manually until a proxy (for example
  # Cloudflare) adds them, then restore:
  # schedule:
  #   - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  headers:
    name: Production security headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify response headers
        run: |
          chmod +x ./tools/verify-security-headers.sh
          ./tools/verify-security-headers.sh "${{ github.event.inputs.url || 'https://shellui.com/' }}"
