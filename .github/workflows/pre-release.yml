name: Pre-release check

# Gate develop → main merges: version + changelog + production build.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pre-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-release:
    name: Pre-release checklist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run pre-release checklist
        run: |
          chmod +x ./tools/pre-release-check.sh ./tools/verify-site.sh
          ./tools/pre-release-check.sh
