)"/><rect x="70" y="330" width="660" height="140" rx="14" fill="#0B1220" stroke="#1E2939" stroke-width="1.5"/><circle cx="118" cy="380" r="24" fill="#E3A512"/><text x="118" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#030712" text-anchor="middle">2</text><text x="160" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="650" fill="#FFFFFF" text-anchor="start">Origin</text><text x="160" y="438" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#9CA3AF" text-anchor="start">event.origin is on the allowlist</text><line x1="400" y1="472" x2="400" y2="506" stroke="#E3A512" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="510" width="660" height="140" rx="14" fill="#0B1220" stroke="#1E2939" stroke-width="1.5"/><circle cx="118" cy="560" r="24" fill="#E3A512"/><text x="118" y="570" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#030712" text-anchor="middle">3</text><text x="160" y="570" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="650" fill="#FFFFFF" text-anchor="start">Source</text><text x="160" y="618" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#9CA3AF" text-anchor="start">A known frame, the parent or same window</text><line x1="400" y1="652" x2="400" y2="686" stroke="#E3A512" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="690" width="660" height="140" rx="14" fill="#0B1220" stroke="#1E2939" stroke-width="1.5"/><circle cx="118" cy="740" r="24" fill="#E3A512"/><text x="118" y="750" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#03