system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">Object with a type</text><text x="124" y="324" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">starting with SHELLUI_</text><line x1="314" y1="295" x2="346" y2="295" stroke="#E3A512" stroke-width="2.5" marker-end="url(#ah)"/><line x1="205" y1="394" x2="205" y2="478" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="350" y="200" width="210" height="190" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="384" cy="236" r="16" fill="#E3A512"/><text x="384" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#030712" text-anchor="middle">2</text><text x="412" y="243" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="650" fill="#030712" text-anchor="start">Origin</text><text x="374" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">event.origin is on</text><text x="374" y="324" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">the allowlist</text><line x1="564" y1="295" x2="596" y2="295" stroke="#E3A512" stroke-width="2.5" marker-end="url(#ah)"/><line x1="455" y1="394" x2="455" y2="478" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="600" y="200" width="210" height="190" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="634" cy="236" r="16" fill="#E3A512"/><text x="634" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#030712" text-anchor="middle">3</text><text x="662" y="243" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="650" fill="#030712" text-anchor="start">Source</text><text x="624" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">A known frame, the</text><text x="624" y="324" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">parent or same window</text><line x1="814" y1="295" x2="846" y2="295" stroke="#E3A512" stroke-width="2.5" marker-end="url(#ah)"/><line x1="705" y1="394" x2="705" y2="478" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="850" y="200" width="210" height="190" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="884" cy="236" r="16" fill="#E3A512"/><text x="884" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#030712" text-anchor="middle">4</text><text x="912" y="243" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="650" fill="#030712" text-anchor="start">Privilege</text><text x="874" y="300" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">Login, storage, toasts:</text><text x="874" y="324" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#6B7280" text-anchor="start">registered frames only</text><line x1="955" y1="394" x2="955" y2="478" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5 5"/><rect x="100" y="480" width="960" height="60" rx="12" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="8 6"/><text x="580" y="517" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#B42318" text-anchor="middle">Rejected: "Rejected untrusted SHELLUI message" with the reason</text><text x="580" y="582" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#8A6300" text-anchor="middle">Passed all four: the shell runs the handler</text></svg>